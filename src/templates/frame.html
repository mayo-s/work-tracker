<!doctype html>
<html lang="en"{{theme}}>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}} · Work Tracker</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/main.css">
  <script type="module" src="/static/js/main.js"></script>
</head>
<body>
  <a class="skip-link" href="#app">Skip to content</a>
  <header class="app-header">
    <a class="app-name" href="/">Work Tracker</a>
    <a class="review-shortcut" href="/review" hidden>Review</a>
    <button type="button" class="button-small menu-toggle" aria-expanded="false" aria-controls="app-menu">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4h12M2 8h12M2 12h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      Menu
    </button>
    <div class="app-menu" id="app-menu">
      <nav class="app-nav" aria-label="Main">
        <a href="/">Dashboard</a>
        <a href="/week">Week</a>
        <a href="/month">Month</a>
        <a href="/year">Year</a>
        <a href="/review" hidden>Review</a>
        <a href="/settings">Settings</a>
      </nav>
      <div class="app-user">
        <form class="nav-search" role="search" action="/search">
          <input type="search" name="text" maxlength="200" aria-label="Search entries" placeholder="Search entries…">
        </form>
      </div>
    </div>
  </header>
  <main id="app" data-page="{{page}}" tabindex="-1">
{{content}}
  </main>
  <noscript>This page needs JavaScript (build it with <code>npm run build</code>).</noscript>
  <footer class="app-footer">
    <a href="/imprint">Imprint</a>
    <span aria-hidden="true">·</span>
    <a href="https://github.com/mayo-s/work-tracker#license" target="_blank" rel="noopener">License<span class="visually-hidden"> (opens in a new tab)</span></a>
    <span aria-hidden="true">·</span>
    <a href="https://github.com/mayo-s/work-tracker" target="_blank" rel="noopener">Source code<span class="visually-hidden"> (opens in a new tab)</span></a>
  </footer>
</body>
</html>
