    <div class="week-header">
      <div>
        <h1 id="week-title">Week</h1>
        <p class="muted" id="week-period"></p>
      </div>
      <nav class="week-nav" aria-label="Weeks">
        <a class="button" id="week-previous" href="/week">‹ Previous</a>
        <a class="button" id="week-current" href="/week">Today</a>
        <a class="button" id="week-next" href="/week">Next ›</a>
        <form class="period-go" id="week-go">
          <label class="visually-hidden" for="week-go-date">Go to the week of</label>
          <input type="date" id="week-go-date" name="date" min="2000-01-01" max="2100-12-31" required>
          <button type="submit" class="button">Go</button>
        </form>
        <button type="button" class="button" id="week-book-days-off" aria-expanded="false">Book days off</button>
      </nav>
    </div>
    <div id="days-off"></div>
    <section id="week" aria-live="polite"></section>
